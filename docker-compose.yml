services:
  localstack:
    # Pinned to the last pre-merge Community image. Since 2026-03-23, the
    # `latest` tag points to LocalStack's unified image, which requires a
    # LOCALSTACK_AUTH_TOKEN (free account) even for community features.
    # This tag predates that change, so no account/token is needed.
    image: localstack/localstack:4.14.0
    container_name: terrals-localstack
    ports:
      - "4566:4566" # LocalStack Gateway (all services go through this one port)
    environment:
      - SERVICES=s3,dynamodb,lambda,apigateway,iam,sts,logs,cloudwatch,ec2
      - DEBUG=0
      # Lambda functions are executed in Docker containers spun up by LocalStack,
      # so it needs access to the host's Docker daemon.
      - LAMBDA_EXECUTOR=docker
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack-data:/var/lib/localstack"

volumes:
  localstack-data:
